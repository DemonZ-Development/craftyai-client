name: Feature Request
description: Suggest an idea for CraftyAI
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea to make CraftyAI better! Before submitting, please search existing issues to see if your idea has already been proposed.
  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Which part of CraftyAI does this affect?"
      options:
        - Plugin (Spigot/Paper/Purpur/Folia)
        - Mod (Fabric)
        - Mod (Forge/NeoForge)
        - Common library
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem? Please describe."
      description: "A clear and concise description of what the problem is. Ex. I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "Any alternative solutions or features you've thought about."
  - type: input
    id: mcversions
    attributes:
      label: "Affected Minecraft versions"
      description: "Which Minecraft versions should this feature support?"
      placeholder: "e.g., 1.20.4, 1.21.x, 26.x"
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Add any other context, screenshots, or mockups about the feature request here."
