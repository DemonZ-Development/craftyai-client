name: Bug Report
description: Create a report to help us improve CraftyAI
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible so we can reproduce the issue.
  - type: input
    id: version
    attributes:
      label: "CraftyAI Version"
      description: "What version of the plugin/mod are you running?"
      placeholder: "e.g., 1.3.1"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Which part of CraftyAI is affected?"
      options:
        - Plugin (Spigot/Paper/Purpur/Folia)
        - Mod (Fabric)
        - Mod (Forge/NeoForge)
        - Common library
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "Server Platform & Version"
      description: "e.g., Paper 1.20.4, Fabric 1.20.1, NeoForge 26.0"
      placeholder: "Paper 1.20.4"
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: "Java Version"
      description: "e.g., Java 17, Java 21, Java 25"
      placeholder: "Java 21"
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen instead?"
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Start the server with CraftyAI installed
        2. Type '@crafty hello' in chat
        3. See error in console
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Console Errors / Logs"
      description: "Paste any errors from your server console here. Remember to redact any API keys."
      render: "shell"
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Videos"
      description: "If applicable, add screenshots or short videos to help explain the problem."
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Anything else that might help us reproduce the issue (server version, mod loader version, other mods/plugins installed, etc.)."
