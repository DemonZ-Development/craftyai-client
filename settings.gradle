pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.fabricmc.fabric-loom' &&
                    settings.startParameter.projectProperties.get('minecraftVersion') == '26.3') {
                useVersion('1.17.21')
            }
        }
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'craftyai-client'

include 'craftyai-common'

def target = startParameter.projectProperties.get('target') ?: providers.gradleProperty('target').getOrElse('auto')

if (target == 'forge-modern-matrix') {
    include 'craftyai-forge-modern-matrix'
} else if (target == 'neoforge-legacy-matrix') {
    include 'craftyai-neoforge-legacy-matrix'
} else if (target == 'neoforge-matrix') {
    include 'craftyai-neoforge-matrix'
} else if (target == 'forge-matrix') {
    include 'craftyai-forge-matrix'
} else if (target == 'fabric-matrix') {
    include 'craftyai-fabric-matrix'
} else if (target == 'forge-only') {
    include 'craftyai-forge'
} else if (target == 'forge1206') {
    include 'craftyai-forge-1206'
} else if (target == 'legacy') {
    include 'craftyai-fabric'
    include 'craftyai-forge'
} else if (target == 'modern') {
    include 'craftyai-fabric-26'
    include 'craftyai-forge-26'
} else if (target == 'fabric26') {
    include 'craftyai-fabric-26'
} else if (target == 'forge26') {
    include 'craftyai-forge-26'
} else {
    if (GradleVersion.current() >= GradleVersion.version('9.0')) {
        include 'craftyai-fabric-26'
        include 'craftyai-forge-26'
    } else {
        include 'craftyai-fabric'
        include 'craftyai-forge'
    }
}
