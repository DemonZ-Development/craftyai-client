pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'craftyai-client'

// Always include shared library
include 'craftyai-common'

// Module inclusion controlled by Gradle property -Ptarget=<legacy|modern>
// CI passes the correct target for each build job.
// Default: auto-detect based on Gradle version.
def target = startParameter.projectProperties.get('target') ?: providers.gradleProperty('target').getOrElse('auto')

if (target == 'forge-only') {
    // Forge-only: Build Forge mod standalone (no fabric-loom conflict)
    include 'craftyai-forge'
} else if (target == 'forge1206') {
    // Legacy Forge mod for MC 1.20.6 (Gradle 8.x, Java 21, ForgeGradle 6)
    include 'craftyai-forge-1206'
} else if (target == 'legacy') {
    // Legacy mods: Fabric 1.20 + Forge (Gradle 8.x, Java 17, Loom 1.7.4)
    include 'craftyai-fabric'
    include 'craftyai-forge'
} else if (target == 'modern') {
    // Modern mods: Fabric 26 & NeoForge 26 (Gradle 9.x, Java 25)
    include 'craftyai-fabric-26'
    include 'craftyai-forge-26'
} else if (target == 'fabric26') {
    // Fabric 26 mod (Gradle 9.x, Java 25, Loom)
    include 'craftyai-fabric-26'
} else if (target == 'forge26') {
    // NeoForge 26 mod (Gradle 9.x, Java 25, ModDevGradle)
    include 'craftyai-forge-26'
} else {
    // Auto: include what's compatible with current Gradle version
    if (GradleVersion.current() >= GradleVersion.version('9.0')) {
        include 'craftyai-fabric-26'
        include 'craftyai-forge-26'
    } else {
        include 'craftyai-fabric'
        include 'craftyai-forge'
    }
}
