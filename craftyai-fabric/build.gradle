plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = '1.4.0'
group = 'com.demonz'

base {
    archivesName = 'craftyai-fabric'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'LWJGL'
        url = 'https://repository.lwjgl.org/content/repositories/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.4"
    mappings "net.fabricmc:yarn:1.20.4+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.7"

    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.1+1.20.4"

    implementation project(':craftyai-common')

    implementation "com.google.code.gson:gson:2.10.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDir project(':craftyai-common').file('src/main/java')
        }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn ':craftyai-common:classes'
    from project(':craftyai-common').sourceSets.main.output
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from project(":craftyai-common").sourceSets.main.output
}
