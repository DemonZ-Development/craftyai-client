buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

repositories {
    maven {
        name = 'forge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

version = '1.3.2'
group = 'com.demonz'
archivesBaseName = 'craftyai-forge'

def currentJavaVersion = JavaVersion.current().majorVersion.toInteger()
java.toolchain.languageVersion = JavaLanguageVersion.of(Math.max(currentJavaVersion, 17))

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

minecraft {
    mappings channel: 'official', version: '1.20.4'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                craftyai {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                craftyai {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir project(':craftyai-common').file('src/main/java')
        }
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.4-49.0.49'

    // Shared CraftyAI library
    implementation project(':craftyai-common')

    // GSON for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn ':craftyai-common:classes'
    manifest {
        attributes([
            "Specification-Title"     : "craftyai",
            "Specification-Vendor"    : "DemonZ Development",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "DemonZ Development",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    from project(":craftyai-common").sourceSets.main.output
}

// Official mappings used in MC 1.20.4; reobfJar is disabled to prevent mapping cache issues
// jar.finalizedBy('reobfJar')

