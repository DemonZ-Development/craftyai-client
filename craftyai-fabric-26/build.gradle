plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.1'
    id 'maven-publish'
}

version = "1.3.2"
group = "com.demonz"

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }

}

dependencies {
    // Shared CraftyAI library (not a mod)
    implementation project(':craftyai-common')

    // Minecraft 26.1.2 is unobfuscated
    minecraft "com.mojang:minecraft:26.1.2"
    
    // In the non-remap plugin, we use standard configurations
    implementation "net.fabricmc:fabric-loader:0.18.6"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"

    // GSON for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
}

loom {
    // Configuration for unobfuscated environments
}

sourceSets {
    main {
        java {
            srcDir project(':craftyai-common').file('src/main/java')
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn ':craftyai-common:classes'
    from project(':craftyai-common').sourceSets.main.output
}
