plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.1'
    id 'maven-publish'
}

version = "1.4.0"
group = "com.demonz"

def minecraftVersion = providers.gradleProperty('minecraftVersion').getOrElse('26.1.2')
def fabricLoaderVersion = minecraftVersion == '26.3' ? '0.19.5' : '0.19.4'
def fabricApiVersion = ['26.1': '0.145.1+26.1', '26.1.1': '0.145.4+26.1.1',
                        '26.1.2': '0.155.2+26.1.2', '26.2': '0.160.0+26.2',
                        '26.3': '0.160.6+26.3'][minecraftVersion]
if (fabricApiVersion == null) throw new GradleException("Unknown Fabric target: ${minecraftVersion}")
base.archivesName = "craftyai-fabric-mc${minecraftVersion}"
layout.buildDirectory = layout.projectDirectory.dir("build/mc${minecraftVersion}")

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    implementation project(':craftyai-common')
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation 'com.google.code.gson:gson:2.10.1'
}

loom {
}

sourceSets {
    main {
        java {
            srcDir project(':craftyai-common').file('src/main/java')
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftVersion", minecraftVersion
    inputs.property "fabricApiVersion", fabricApiVersion
    inputs.property "fabricLoaderVersion", fabricLoaderVersion
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraftVersion": minecraftVersion, "fabricApiVersion": fabricApiVersion, "fabricLoaderVersion": fabricLoaderVersion
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn ':craftyai-common:classes'
    from project(':craftyai-common').sourceSets.main.output
}

apply from: rootProject.file('gradle/minecraft-26.3.gradle')
