plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.17'
}
version = '1.4.0'
group = 'com.demonz'
def mc = providers.gradleProperty('minecraftVersion').get()
def target = new groovy.json.JsonSlurper().parse(rootProject.file('loader-targets.json')).targets.find { it.minecraft == mc }
if (!mc.startsWith('26.') || target?.forge == null) throw new GradleException("No modern Forge target for ${mc}")
base.archivesName = "craftyai-forge-mc${mc}"
layout.buildDirectory = layout.projectDirectory.dir("build/mc${mc}")
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${target.forge}")
    implementation project(':craftyai-common')
    implementation 'com.google.code.gson:gson:2.10.1'
}

def sources = tasks.register('prepareMappedSources', Sync) {
    inputs.property('minecraftVersion', mc)
    inputs.file(project.buildFile)
    from rootProject.file('craftyai-forge-26/src/main/java')
    into layout.buildDirectory.dir('generated/sources/compat')
    filteringCharset = 'UTF-8'
    filter { line ->
        line = line.replace('net.neoforged.neoforge.', 'net.minecraftforge.')
                .replace('net.neoforged.fml.', 'net.minecraftforge.fml.')
                .replace('net.neoforged.api.', 'net.minecraftforge.api.')
                .replace('net.neoforged.bus.api.SubscribeEvent', 'net.minecraftforge.eventbus.api.listener.SubscribeEvent')
                .replace('net.neoforged.bus.api.IEventBus', 'net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext')
                .replace('net.minecraftforge.fml.common.EventBusSubscriber', 'net.minecraftforge.fml.common.Mod.EventBusSubscriber')
                .replace('net.minecraftforge.client.event.ClientTickEvent', 'net.minecraftforge.event.TickEvent.ClientTickEvent')
                .replace('NeoForge', 'MinecraftForge')
                .replace('IEventBus modEventBus', 'FMLJavaModLoadingContext context')
                .replace('MinecraftForge.EVENT_BUS.register(this)', 'MinecraftForge.EVENT_BUS.register(java.lang.invoke.MethodHandles.lookup(), this)')
                .replace('MinecraftForge.EVENT_BUS.addListener((net.minecraftforge.event.server.ServerStartedEvent event)', 'net.minecraftforge.event.server.ServerStartedEvent.BUS.addListener((net.minecraftforge.event.server.ServerStartedEvent event)')
                .replace('MinecraftForge.EVENT_BUS.addListener((net.minecraftforge.event.server.ServerStoppingEvent event)', 'net.minecraftforge.event.server.ServerStoppingEvent.BUS.addListener((net.minecraftforge.event.server.ServerStoppingEvent event)')
                .replace('modEventBus.addListener(this::onCommonSetup)', 'FMLCommonSetupEvent.getBus(context.getModBusGroup()).addListener(this::onCommonSetup)')
                .replace('net.minecraftforge.client.gui.IConfigScreenFactory.class', 'net.minecraftforge.client.ConfigScreenHandler.ConfigScreenFactory.class')
                .replace('() -> (container, parent) -> new CraftyAIForgeSettingsScreen(parent)', '() -> new net.minecraftforge.client.ConfigScreenHandler.ConfigScreenFactory((client, parent) -> new CraftyAIForgeSettingsScreen(parent))')
                .replace('world.getServer().getPlayerList().isOp(sp.nameAndId())', 'sp.permissions().hasPermission(net.minecraft.server.permissions.Permissions.COMMANDS_GAMEMASTER)')
                .replace(', bus = EventBusSubscriber.Bus.MOD) // FORGE_KEY_BUS', ')')
        return line
    }
    doLast {

        fileTree(destinationDir).matching { include '**/*Mod*.java' }.each { file ->
            def text = file.getText('UTF-8')
            ['onServerChat', 'onClientChat'].each { method ->
                def signature = text =~ /public (?:static )?void ${method}\(/
                if (signature.find()) {
                    int start = signature.start()
                    int end = text.indexOf('\n    }', start)
                    def body = text.substring(start, end)
                    body = body.replace("void ${method}(", "boolean ${method}(")
                            .replace('event.setCanceled(true);', 'cancelled = true;')
                            .replace('return;', 'return cancelled;')
                    int brace = body.indexOf('{')
                    body = body.substring(0, brace + 1) + '\n        boolean cancelled = false;' + body.substring(brace + 1)
                    text = text.substring(0, start) + body + '\n        return cancelled;' + text.substring(end)
                }
            }
            file.setText(text, 'UTF-8')
        }
        fileTree(destinationDir).matching { include '**/*Mod.java' }.each { file ->
            def text = file.getText('UTF-8')
            text = text.replace('public void onCommonSetup(FMLCommonSetupEvent event) {', 'private void onCommonSetup() {')
                    .replace('FMLCommonSetupEvent.getBus(context.getModBusGroup()).addListener(this::onCommonSetup)',
                             'FMLCommonSetupEvent.getBus(context.getModBusGroup()).addListener(event -> this.onCommonSetup())')
            file.setText(text, 'UTF-8')
        }
    }
}
sourceSets.main {
    java.srcDir sources
    java.srcDir project(':craftyai-common').file('src/main/java')
    resources.srcDir rootProject.file('craftyai-forge-1206/src/main/resources')
}
processResources {
    inputs.properties(minecraftVersion: mc, forgeVersion: target.forge)
    filesMatching('META-INF/mods.toml') {
        filter { line -> line.replace('[1.20.6]', "[${mc}]").replace('[50.2.10,)', "[${target.forge.split('-')[1]},)").replace('[50,)', "[${target.forge.split('-')[1].split('\\.')[0]},)") }
    }
}
jar { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
